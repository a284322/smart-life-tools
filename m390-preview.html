<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mobile preview (temp)</title>
<style>
  html, body { margin: 0; padding: 0; background: #e2e8f0; overflow: hidden; }
  body > ins, body > iframe:not(#m390), body > div[id^="aswift"] { display: none !important; }
  .frame { position: relative; width: 390px; height: 993px; margin: 0 auto; overflow: hidden; background: #fff; }
  .frame iframe { position: absolute; left: 0; display: block; width: 390px; height: 7200px; border: 0; }
</style>
</head>
<body>
<div class="frame">
  <iframe id="m390" src="calculator.html?ads=off" title="생활계산기 모바일 미리보기"></iframe>
</div>
<script>
  function applyOffset() {
    var y = parseInt((location.hash || '#0').replace('#', ''), 10) || 0;
    var f = document.getElementById('m390');
    f.style.top = (-y) + 'px';
    try {
      var d = f.contentDocument;
      var s = d.getElementById('hide-ads-preview');
      if (!s) { s = d.createElement('style'); s.id = 'hide-ads-preview'; (d.head || d.documentElement).appendChild(s); }
      s.textContent = 'ins.adsbygoogle, iframe[id^="aswift"], body > ins, .ad-slot, iframe[src*="googleads"], iframe[src*="doubleclick"] { display:none !important; visibility:hidden !important; height:0 !important; }';
      f.contentWindow.scrollTo(0, 0);
    } catch (e) {}
  }
  window.addEventListener('hashchange', applyOffset);
  window.addEventListener('load', applyOffset);
  applyOffset();
</script>
</body>
</html>
