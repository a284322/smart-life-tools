<!DOCTYPE html>
<html lang="ko">
<head>

<title>모바일 미리보기 (임시)</title>
<style>

  .col h2 { font-size:12px; margin:0; padding:8px 10px; background:#0f172a; color:#fff; }

</style>

<body>
<h1>모바일 미리보기 – 360px / 390px</h1>

<div class="row">

  <div class="col"><h2>unemployment 360</h2><iframe id="u360" src="unemployment.html?p=2" width="360"></iframe></div>
</div>

<div class="row">

</div>

<div class="row">
  <div class="col"><h2>tarot 390</h2><iframe id="t390" src="tarot.html?p=2" width="390"></iframe></div>
  <div class="col"><h2>tarot 360</h2><iframe id="t360" src="tarot.html?p=2" width="360"></iframe></div>
</div>

<div class="row">
  <div class="col"><h2>index 360</h2><iframe id="i360" src="index.html?p=2" width="360"></iframe></div>

</div>
</body>
</html>
